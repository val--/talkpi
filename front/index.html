<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Michk.IA — Chat</title>
    <style>
      :root{
        /* Dark/technical theme */
        --bg: #0b0f14;
        --panel: #071018;
        --card: #0f1720;
        --accent: #ff4165; /* neon/red accent */
        --accent-2: #7c3aed; /* purple */
        --muted: #94a3b8;
        --user-bg: rgba(124,58,237,0.10);
        --assistant-bg: rgba(255,65,101,0.06);
        --radius: 12px;
        --gap: 12px;
        --max-width: 1200px;
        --font-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', 'Courier New', monospace;
        --chat-height: 600px;
      }
      html,body{height:100%; margin:0; padding:0; overflow-x:hidden;}
      body { font-family: var(--font-sans); background:linear-gradient(180deg,#06080b 0%, #0b0f14 100%); color:#e6eef6; }
      #app { max-width: var(--max-width); margin:0 auto; padding:28px 18px; }

      .shell{ display:flex; flex-direction:column; gap:10px; }
      
      /* Header with cat + title */
      .header-bar{ 
        display:flex; 
        align-items:center; 
        justify-content:space-between; 
        gap:24px; 
      }
      .brand{ display:flex; align-items:center; gap:20px; }
      
      /* Cat avatar in header - floating, no frame */
      .cat-avatar{
        flex-shrink: 0;
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .cat-image{
        width: 180px;
        height: 180px;
        object-fit: contain;
        filter: 
          drop-shadow(0 8px 20px rgba(0,0,0,0.6)) 
          drop-shadow(0 0 40px rgba(57,255,20,0.15))
          drop-shadow(0 0 80px rgba(124,58,237,0.1));
        position: relative;
        z-index: 1;
        animation: catFloat 4s ease-in-out infinite;
      }
      
      @keyframes catFloat{
        0%, 100%{ transform: translateY(0); }
        50%{ transform: translateY(-6px); }
      }

      @keyframes pulseGlow{
        0%{ opacity:0.7; }
        50%{ opacity:1; }
        100%{ opacity:0.7; }
      }
      
      .brand-text{ display:flex; flex-direction:column; gap:8px; }
      .title{ font-size:2.4rem; font-weight:800; color:#fff; font-family: var(--mono); letter-spacing:1px; line-height:1.1; }
      .subtitle{ color:var(--muted); font-size:1.05rem; max-width:400px; }
      .meta{ font-size:0.85rem; color:var(--muted); font-family:var(--mono); text-align:right; }
      
      .card{ background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:var(--radius); box-shadow: 0 12px 40px rgba(0,0,0,0.6); overflow:hidden; position:relative; border:1px solid rgba(255,255,255,0.02); }
      .chat-area{ display:flex; flex-direction:column; min-height: 500px; max-height: 70vh; }
      .messages{ padding:18px; display:flex; flex-direction:column; gap:12px; overflow:auto; flex:1; scrollbar-width: thin; scrollbar-color: rgba(57, 255, 20, 0.3) transparent; }
      .messages::-webkit-scrollbar{ width:6px; }
      .messages::-webkit-scrollbar-track{ background:transparent; }
      .messages::-webkit-scrollbar-thumb{ background:rgba(57, 255, 20, 0.3); border-radius:3px; }
      .messages::-webkit-scrollbar-thumb:hover{ background:rgba(57, 255, 20, 0.5); }

      .message{ display:flex; gap:10px; align-items:flex-start; }
      .avatar{ width:40px; height:40px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-weight:700; color:#0b1220; background:linear-gradient(180deg,#e6eef6,#c7d2da); flex-shrink:0; overflow:hidden; }
      .avatar.user{ background:linear-gradient(135deg, rgba(124,58,237,0.95), rgba(99,102,241,0.95)); color:#fff; }
      .avatar.assistant{ background:#000; padding:0; }
      .avatar.system{ background:rgba(255,255,255,0.1); color:var(--muted); }
      .avatar-img{ width:160%; height:300%; object-fit:cover; object-position: center -5%; margin-left:5%; margin-top:55%; }

      .bubble{ padding:12px 14px; border-radius:10px; max-width:84%; line-height:1.4; color:#e6eef6; font-size:0.98rem; }
      .bubble.user{ background: linear-gradient(180deg, rgba(124,58,237,0.12), rgba(124,58,237,0.06)); border:1px solid rgba(124,58,237,0.08); }
      .bubble.assistant{ background: linear-gradient(180deg, rgba(255,65,101,0.06), rgba(255,65,101,0.02)); border:1px solid rgba(255,65,101,0.03); }

      .controls{ padding:14px 16px; border-top:1px solid rgba(255,255,255,0.02); display:flex; flex-direction:column; gap:10px; }
      .input-row{ display:flex; gap:12px; align-items:flex-end; }
      textarea{ flex:1; min-height:84px; max-height:260px; resize:none; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.06); background:rgba(0,0,0,0.2); color:#e6eef6; font-family:var(--mono); font-size:0.95rem; transition: border-color 0.2s; }
      textarea:focus{ outline:none; border-color: rgba(124,58,237,0.4); }
      
      /* Main action buttons - hacker style */
      .btn-group{ display:flex; flex-direction:column; gap:8px; }
      .btn{ 
        background: transparent; 
        color: #39ff14; 
        border: 1px solid #39ff14; 
        padding: 10px 20px; 
        border-radius: 4px; 
        cursor: pointer; 
        font-weight: 600; 
        font-size: 0.9rem; 
        font-family: var(--mono);
        transition: all 0.15s ease; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
      }
      .btn:hover:not(:disabled){ 
        background: rgba(57,255,20,0.1); 
        box-shadow: 0 0 15px rgba(57,255,20,0.3), inset 0 0 15px rgba(57,255,20,0.05);
      }
      .btn:active:not(:disabled){ background: rgba(57,255,20,0.2); }
      .btn:disabled{ opacity:0.4; cursor:not-allowed; }
      
      .btn.speak{ color: #0ff; border-color: #0ff; }
      .btn.speak:hover:not(:disabled){ background: rgba(0,255,255,0.1); box-shadow: 0 0 15px rgba(0,255,255,0.3); }
      .btn.speak.recording{ color: #ff3333; border-color: #ff3333; animation: blink 0.8s infinite; }
      .btn.speak.recording:hover{ background: rgba(255,51,51,0.1); box-shadow: 0 0 15px rgba(255,51,51,0.3); }
      
      .btn.stop{ color: #ff3333; border-color: #ff3333; }
      .btn.stop:hover{ background: rgba(255,51,51,0.1); box-shadow: 0 0 15px rgba(255,51,51,0.3); }
      
      @keyframes blink{
        0%, 100%{ opacity:1; }
        50%{ opacity:0.5; }
      }
      
      .btn.secondary{ color: var(--muted); border-color: rgba(255,255,255,0.2); }
      .btn.secondary:hover{ border-color: rgba(255,255,255,0.4); color:#fff; background: rgba(255,255,255,0.05); }
      .btn.ghost{ background:transparent; color:var(--muted); border:none; padding:8px 12px; font-size:0.85rem; }
      .btn.ghost:hover{ color:#39ff14; }
      .controls .row{ display:flex; gap:8px; align-items:center; }

      /* Responsive */
      @media (max-width:768px){ 
        .header-bar{ flex-direction:column; align-items:flex-start; gap:16px; }
        .brand{ gap:16px; }
        .cat-avatar{ width:120px; height:120px; }
        .cat-image{ width:120px; height:120px; }
        .title{ font-size:1.8rem; }
        .subtitle{ font-size:0.95rem; }
        .meta{ text-align:left; }
      }
      @media (max-width:480px){ 
        .title{ font-size:1.4rem; } 
        .messages{ padding:12px; } 
        .cat-avatar{ width:90px; height:90px; }
        .cat-image{ width:90px; height:90px; }
        .subtitle{ font-size:0.85rem; }
      }

      /* ========================================
         MOBILE KIOSK MODE - Raspberry Pi touchscreen
         Layout: Left = Cat button, Right = Chat history
         ======================================== */
      .mobile-kiosk {
        display: none;
      }
      
      @media (max-width: 800px), (max-height: 500px) {
        /* Hide desktop interface */
        .shell { display: none !important; }
        
        /* Show mobile kiosk - horizontal split, NO page scroll */
        .mobile-kiosk {
          display: flex;
          flex-direction: row;
          height: 100vh;
          height: 100dvh;
          max-height: 100vh;
          max-height: 100dvh;
          box-sizing: border-box;
          background: linear-gradient(135deg, #06080b 0%, #0b0f14 100%);
          overflow: hidden;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
        }
        
        /* LEFT HALF: Cat button area - FIXED, no scroll */
        .kiosk-left {
          width: 50%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 16px;
          box-sizing: border-box;
          position: relative;
          background: radial-gradient(ellipse at 50% 50%, rgba(57,255,20,0.08) 0%, transparent 70%);
          overflow: hidden;
          flex-shrink: 0;
        }
        
        /* Cat as clickable button */
        .cat-button {
          position: relative;
          cursor: pointer;
          -webkit-tap-highlight-color: transparent;
          touch-action: manipulation;
          background: none;
          border: none;
          padding: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
        }
        
        .cat-button:active {
          transform: scale(0.96);
        }
        
        /* Cat image wrapper with halo */
        .cat-wrapper {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        
        /* Green halo (default) - more visible */
        .cat-halo {
          position: absolute;
          width: 350px;
          height: 350px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(57,255,20,0.5) 0%, rgba(57,255,20,0.25) 35%, rgba(57,255,20,0.1) 55%, transparent 75%);
          filter: blur(20px);
          transition: all 0.3s ease;
          animation: haloPulse 3s ease-in-out infinite;
        }
        
        @keyframes haloPulse {
          0%, 100% { transform: scale(1); opacity: 0.9; }
          50% { transform: scale(1.05); opacity: 1; }
        }
        
        /* Red halo (recording) - very visible */
        .cat-button.recording .cat-halo {
          background: radial-gradient(circle, rgba(255,51,51,0.6) 0%, rgba(255,51,51,0.35) 35%, rgba(255,51,51,0.15) 55%, transparent 75%);
          animation: haloRecPulse 0.8s ease-in-out infinite;
        }
        
        @keyframes haloRecPulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .kiosk-cat {
          position: relative;
          z-index: 1;
          width: 260px;
          height: auto;
          object-fit: contain;
          filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5));
          animation: catFloat 4s ease-in-out infinite;
          transition: filter 0.3s ease;
        }
        
        .cat-button.recording .kiosk-cat {
          filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5)) drop-shadow(0 0 30px rgba(255,51,51,0.4));
        }
        
        /* Message below cat */
        .cat-message {
          font-family: var(--mono);
          font-size: 0.85rem;
          color: var(--muted);
          text-align: center;
          line-height: 1.4;
          max-width: 180px;
          transition: color 0.3s ease;
        }
        
        .cat-button.recording .cat-message {
          color: #ff6666;
        }
        
        /* RIGHT HALF: Chat history */
        .kiosk-right {
          width: 50%;
          display: flex;
          flex-direction: column;
          padding: 12px 12px 12px 8px;
          box-sizing: border-box;
          overflow: hidden;
          min-height: 0; /* Important for flex child scrolling */
        }
        
        .kiosk-chat-title {
          font-family: var(--mono);
          font-size: 0.75rem;
          color: var(--muted);
          text-transform: uppercase;
          letter-spacing: 1px;
          margin-bottom: 8px;
          flex-shrink: 0;
        }
        
        /* Chat history container - scrollable independently */
        .kiosk-chat-history {
          flex: 1;
          overflow-y: auto;
          overflow-x: hidden;
          display: flex;
          flex-direction: column;
          gap: 8px;
          padding-right: 8px;
          min-height: 0; /* Critical for scroll to work in flex */
          
          /* Firefox scrollbar */
          scrollbar-width: thin;
          scrollbar-color: rgba(57,255,20,0.2) transparent;
          
          /* Smooth scroll */
          scroll-behavior: smooth;
          -webkit-overflow-scrolling: touch;
        }
        
        /* Webkit scrollbar (Chrome, Safari, Edge) */
        .kiosk-chat-history::-webkit-scrollbar { 
          width: 6px; 
        }
        .kiosk-chat-history::-webkit-scrollbar-track { 
          background: rgba(255,255,255,0.02);
          border-radius: 3px;
        }
        .kiosk-chat-history::-webkit-scrollbar-thumb { 
          background: rgba(57,255,20,0.25);
          border-radius: 3px;
          transition: background 0.2s ease;
        }
        .kiosk-chat-history::-webkit-scrollbar-thumb:hover { 
          background: rgba(57,255,20,0.4);
        }
        
        /* Chat message bubbles */
        .kiosk-msg {
          padding: 10px 12px;
          border-radius: 10px;
          font-size: 0.85rem;
          line-height: 1.4;
          max-width: 95%;
        }
        
        .kiosk-msg.user {
          background: rgba(124,58,237,0.15);
          border: 1px solid rgba(124,58,237,0.2);
          align-self: flex-end;
          color: #c4b5fd;
        }
        
        .kiosk-msg.assistant {
          background: rgba(57,255,20,0.08);
          border: 1px solid rgba(57,255,20,0.15);
          align-self: flex-start;
          color: #e6eef6;
        }
        
        .kiosk-msg.system {
          background: rgba(255,255,255,0.05);
          border: 1px solid rgba(255,255,255,0.08);
          align-self: center;
          color: var(--muted);
          font-size: 0.75rem;
          font-style: italic;
        }
        
        /* Empty state */
        .kiosk-empty {
          color: var(--muted);
          font-style: italic;
          font-size: 0.8rem;
          text-align: center;
          padding: 20px;
        }
        
        /* Hide old elements */
        .kiosk-header, .kiosk-bottom, .kiosk-center, .kiosk-response, .kiosk-footer,
        .record-btn-wrapper, .kiosk-record-btn, .kiosk-status, .wave-ring {
          display: none !important;
        }
      }
      
      /* Smaller screens (480x320, 3.5" displays) */
      @media (max-height: 400px) {
        .kiosk-left { padding: 10px; }
        .kiosk-cat { width: 180px; }
        .cat-halo { width: 250px; height: 250px; }
        .cat-message { font-size: 0.75rem; max-width: 180px; }
        .kiosk-right { padding: 8px 12px 8px 6px; }
        .kiosk-chat-title { font-size: 0.65rem; margin-bottom: 6px; }
        .kiosk-msg { padding: 8px 10px; font-size: 0.75rem; }
      }
      
      /* Very small screens (320x240) */
      @media (max-height: 280px) {
        .kiosk-left { padding: 6px; }
        .kiosk-cat { width: 120px; }
        .cat-halo { width: 170px; height: 170px; }
        .cat-message { font-size: 0.65rem; max-width: 130px; gap: 6px; }
        .cat-button { gap: 6px; }
        .kiosk-right { padding: 6px 8px 6px 4px; }
        .kiosk-chat-title { font-size: 0.6rem; margin-bottom: 4px; }
        .kiosk-msg { padding: 6px 8px; font-size: 0.65rem; border-radius: 8px; }
      }
    </style>
    <!-- React + Babel via CDN for a simple no-build example -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Markdown rendering and sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <script type="text/babel">
      const { useState, useRef, useEffect } = React;

      // ============================================
      // CONFIGURATION - Message d'accueil
      // ============================================
      const WELCOME_MESSAGE = "Bonjour, je suis **Michk.IA**. Posez-moi des questions !";
      // Mobile breakpoint (px) - show kiosk mode below this width or height
      const MOBILE_WIDTH = 800;
      const MOBILE_HEIGHT = 500;
      // ============================================

      // Hook to detect window size for responsive rendering
      function useIsMobile() {
        const [isMobile, setIsMobile] = useState(() => {
          if (typeof window === 'undefined') return false;
          return window.innerWidth <= MOBILE_WIDTH || window.innerHeight <= MOBILE_HEIGHT;
        });
        
        useEffect(() => {
          const checkMobile = () => {
            setIsMobile(window.innerWidth <= MOBILE_WIDTH || window.innerHeight <= MOBILE_HEIGHT);
          };
          
          window.addEventListener('resize', checkMobile);
          window.addEventListener('orientationchange', checkMobile);
          // Check on mount
          checkMobile();
          
          return () => {
            window.removeEventListener('resize', checkMobile);
            window.removeEventListener('orientationchange', checkMobile);
          };
        }, []);
        
        return isMobile;
      }

      function App(){
        const isMobile = useIsMobile();
        const [input, setInput] = useState('');
        const [messages, setMessages] = useState([
          { role: 'assistant', text: '' }
        ]);
        const [loading, setLoading] = useState(false);
        const [recording, setRecording] = useState(false);
        const [countdown, setCountdown] = useState(0);
        const recorderRef = useRef(null);
        const streamRef = useRef(null);
        const timerRef = useRef(null);
        const autoStopRef = useRef(null);
        const audioRef = useRef(null);
        const audioQueueRef = useRef([]);
        const audioPlayingRef = useRef(false);
        const messagesRef = useRef(null);
        const scrollDebounceRef = useRef(null);
        const abortControllerRef = useRef(null);
        const welcomeTypedRef = useRef(false);

        // Typing effect for welcome message
        useEffect(() => {
          if (welcomeTypedRef.current) return;
          welcomeTypedRef.current = true;
          
          let index = 0;
          const typeSpeed = 30; // ms per character
          
          const typeChar = () => {
            if (index <= WELCOME_MESSAGE.length) {
              setMessages([{ role: 'assistant', text: WELCOME_MESSAGE.slice(0, index) }]);
              index++;
              setTimeout(typeChar, typeSpeed);
            }
          };
          
          // Start typing after a small delay
          setTimeout(typeChar, 500);
        }, []);

        // cleanup on unmount
        useEffect(()=>{
          return ()=>{
            if(timerRef.current) clearInterval(timerRef.current);
            if(autoStopRef.current) clearTimeout(autoStopRef.current);
            if(streamRef.current){ streamRef.current.getTracks().forEach(t=>t.stop()); }
            if(scrollDebounceRef.current) clearTimeout(scrollDebounceRef.current);
          };
        }, []);

        // Auto-scroll to bottom when messages change, only if user is near bottom
        const isAtBottomRef = useRef(true);
        const [showScrollBtn, setShowScrollBtn] = useState(false);

        useEffect(()=>{
          try{
            const el = messagesRef.current;
            if(!el) return;
            if(isAtBottomRef.current){
              // Debounce scroll to avoid repeated scrolls during fast streaming
              if(scrollDebounceRef.current) clearTimeout(scrollDebounceRef.current);
              scrollDebounceRef.current = setTimeout(()=>{
                const last = el.lastElementChild;
                if(last && typeof last.scrollIntoView === 'function'){
                  last.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }else{
                  el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
                }
              }, 120);
              setShowScrollBtn(false);
            }else{
              // user is reading history: show jump-to-bottom button
              setShowScrollBtn(true);
            }
          }catch(e){ /* ignore */ }
        }, [messages]);

        // Track scroll position to detect if user is at bottom
        useEffect(()=>{
          const el = messagesRef.current;
          if(!el) return;
          const onScroll = ()=>{
            const threshold = 80; // px
            const atBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) <= threshold;
            isAtBottomRef.current = atBottom;
            if(atBottom) setShowScrollBtn(false);
          };
          el.addEventListener('scroll', onScroll);
          // initialize
          onScroll();
          return ()=> el.removeEventListener('scroll', onScroll);
        }, []);

        // play next audio chunk in queue
        function playNextAudio(){
          if(audioPlayingRef.current) {
            console.log('AUDIO_QUEUE: playback already in progress');
            return;
          }
          const q = audioQueueRef.current;
          if(!q.length) {
            console.log('AUDIO_QUEUE: queue empty, nothing to play');
            return;
          }
          const url = q.shift();
          console.log('AUDIO_QUEUE: starting playback, queue remaining=', q.length);
          audioPlayingRef.current = true;
          if(audioRef.current){
            audioRef.current.src = url;
            console.log('AUDIO_QUEUE: set audio src, calling play()');
            const p = audioRef.current.play();
            if(p && p.catch){
              p.catch(err=>{ 
                console.error('AUDIO_QUEUE: play() rejected:', err);
              }).finally(()=>{});
            }
            audioRef.current.onended = ()=>{
              console.log('AUDIO_QUEUE: audio ended, revoking URL');
              // revoke object URL and continue
              try{ URL.revokeObjectURL(url); }catch(e){}
              audioPlayingRef.current = false;
              // play next if available
              setTimeout(()=>playNextAudio(), 50);
            };
          }
        }

        // Helper to parse SSE-like events from a fetch stream
        async function streamEvents(resp, handlers){
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buf = '';
          console.log('[SSE] starting stream reader');
          while(true){
            const {done, value} = await reader.read();
            if(done) { 
              console.log('[SSE] stream ended');
              break;
            }
            buf += decoder.decode(value, {stream: true});
            let idx;
            while((idx = buf.indexOf('\n\n')) !== -1){
              const raw = buf.slice(0, idx);
              buf = buf.slice(idx + 2);
              // parse event block
              const lines = raw.split(/\r?\n/);
              let ev = 'message';
              let data = '';
              for(const line of lines){
                if(line.startsWith('event:')) ev = line.slice(6).trim();
                else if(line.startsWith('data:')) data += line.slice(5).trim();
              }
              try{
                const payload = JSON.parse(data);
                console.log('[SSE] event:', ev, 'payload keys:', Object.keys(payload));
                if(handlers[ev]) {
                  handlers[ev](payload);
                } else {
                  console.warn('[SSE] no handler for event:', ev);
                }
              }catch(e){
                console.warn('[SSE] failed to parse event data', e, 'data=', data.substring(0,100));
                if(handlers['error']) handlers['error']({error: 'parse_error'});
              }
            }
          }
        }

        function stopGeneration(){
          if(abortControllerRef.current){
            abortControllerRef.current.abort();
            abortControllerRef.current = null;
          }
          // Stop audio playback
          if(audioRef.current){ 
            audioRef.current.pause(); 
            audioRef.current.currentTime = 0;
          }
          audioQueueRef.current = [];
          audioPlayingRef.current = false;
          setLoading(false);
        }

        async function sendText(text){
          if(!text) return;
          // Add user message
          setMessages(m => [...m, {role:'user', text}]);
          setLoading(true);

          // Create abort controller for this request
          abortControllerRef.current = new AbortController();

          // Add assistant placeholder and keep its index
          let assistantIndex = null;
          setMessages(prev=>{
            assistantIndex = prev.length;
            return [...prev, {role:'assistant', text: ''}];
          });

          try{
            const resp = await fetch('/api/chat-text-stream', {
              method: 'POST', headers: {'Content-Type':'application/json'},
              body: JSON.stringify({text}),
              signal: abortControllerRef.current.signal
            });

            await streamEvents(resp, {
              partial: ({chunk})=>{
                // append chunk to assistant message progressively
                setMessages(prev=>{
                  const copy = prev.slice();
                  const cur = copy[assistantIndex] || {role:'assistant', text:''};
                  cur.text = (cur.text || '') + chunk;
                  copy[assistantIndex] = cur;
                  return copy;
                });
                // attempt to play queued audio if not already
                setTimeout(()=>playNextAudio(), 0);
              },
              audio: ({audio_base64})=>{
                console.log('AUDIO_EVENT: received audio event, size=', audio_base64?audio_base64.length:0);
                if(audio_base64){
                  try{
                    console.log('AUDIO_EVENT: decoding base64...');
                    const bytes = atob(audio_base64);
                    const len = bytes.length;
                    const buffer = new Uint8Array(len);
                    for(let i=0;i<len;i++) buffer[i]=bytes.charCodeAt(i);
                    const blob = new Blob([buffer], {type: 'audio/wav'});
                    const url = URL.createObjectURL(blob);
                    console.log('AUDIO_EVENT: created blob URL:', url);
                    audioQueueRef.current.push(url);
                    console.log('AUDIO_EVENT: enqueued, queue size=', audioQueueRef.current.length);
                    // start playing if nothing is playing
                    setTimeout(()=>playNextAudio(), 0);
                  }catch(e){ console.error('AUDIO_EVENT: decode/enqueue failed', e); }
                }else{
                  console.warn('AUDIO_EVENT: no audio_base64 in event');
                }
              },
              final: ({text: finalText, audio_base64})=>{
                // finalize assistant message
                setMessages(prev=>{
                  const copy = prev.slice();
                  copy[assistantIndex] = {role:'assistant', text: finalText};
                  return copy;
                });
                // only queue audio if server sent one (usually null now since per-sentence audio already played)
                if(audio_base64){
                  try{
                    const bytes = atob(audio_base64);
                    const len = bytes.length;
                    const buffer = new Uint8Array(len);
                    for(let i=0;i<len;i++) buffer[i]=bytes.charCodeAt(i);
                    const blob = new Blob([buffer], {type: 'audio/wav'});
                    const url = URL.createObjectURL(blob);
                    audioQueueRef.current.push(url);
                    setTimeout(()=>playNextAudio(), 0);
                  }catch(e){ console.error('audio play failed', e); }
                }
              },
              error: ({error})=>{
                setMessages(m => [...m, {role:'system', text: 'Erreur : '+(error||'inconnue')}]);
              }
            });
          }catch(e){
            // Don't show error if user aborted
            if(e.name !== 'AbortError'){
              console.error(e);
              setMessages(m => [...m, {role:'system', text: 'Erreur : '+(e.message||e)}]);
            }
          }finally{ 
            setLoading(false); 
            abortControllerRef.current = null;
          }
        }

        function onSend(e){ e.preventDefault(); sendText(input); setInput(''); }

        // Click on cat: start recording, stop recording (send), or interrupt AI
        function onSpeak(){
          if(recording){
            // Already recording → stop and SEND the recorded audio
            stopRecording();
          } else if(loading){
            // AI is generating → stop generation and start new recording
            stopGeneration();
            setTimeout(() => startRecording(), 100);
          } else {
            // Idle → start recording
            // First stop any playing audio
            if(audioRef.current){ 
              audioRef.current.pause(); 
              audioRef.current.currentTime = 0;
            }
            audioQueueRef.current = [];
            audioPlayingRef.current = false;
            startRecording();
          }
        }

        async function startRecording(duration = 7000){
          if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
            alert("Enregistrement non pris en charge dans ce navigateur. Veuillez taper votre question.");
            return;
          }

          setMessages(m => [...m, {role:'system', text: 'Enregistrement : capture de ' + (duration/1000) + 's...'}]);

          try{
            const stream = await navigator.mediaDevices.getUserMedia({audio: true});
            streamRef.current = stream;
            const recorder = new MediaRecorder(stream);
            recorderRef.current = recorder;
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = async ()=>{
              // stop tracks
              try{ streamRef.current.getTracks().forEach(t=>t.stop()); }catch(e){}
              setRecording(false);
              setCountdown(0);
              if(timerRef.current){ clearInterval(timerRef.current); timerRef.current = null; }
              if(autoStopRef.current){ clearTimeout(autoStopRef.current); autoStopRef.current = null; }

              const blob = new Blob(chunks, {type: 'audio/webm'});
              await uploadBlobStream(blob);
            };

            recorder.start();
            setRecording(true);
            setCountdown(Math.ceil(duration/1000));

            // countdown interval
            timerRef.current = setInterval(()=>{
              setCountdown(c=>{
                if(c<=1){ clearInterval(timerRef.current); timerRef.current=null; }
                return Math.max(0, c-1);
              });
            }, 1000);

            // auto stop
            autoStopRef.current = setTimeout(()=>{
              if(recorderRef.current && recorderRef.current.state !== 'inactive') recorderRef.current.stop();
            }, duration);
          }catch(err){
            console.error('record start failed', err);
            setMessages(m => [...m, {role:'system', text: 'Échec de l\'enregistrement : ' + (err.message||err)}]);
            setRecording(false);
            setCountdown(0);
          }
        }

        function stopRecording(){
          if(recorderRef.current && recorderRef.current.state !== 'inactive'){
            recorderRef.current.stop();
          }
          if(timerRef.current){ clearInterval(timerRef.current); timerRef.current = null; }
          if(autoStopRef.current){ clearTimeout(autoStopRef.current); autoStopRef.current = null; }
          setRecording(false);
          setCountdown(0);
        }

        async function uploadBlobStream(blob){
          const fd = new FormData();
          fd.append('file', blob, 'recording.webm');
          setMessages(m => [...m, {role:'system', text: "Téléversement de l'enregistrement pour transcription..."}]);

          // assistantIndex will be set when we receive the transcript event
          let assistantIndex = null;

          try{
            const resp = await fetch('/api/chat-audio-stream', {method:'POST', body: fd});

            await streamEvents(resp, {
              transcript: ({transcript})=>{
                // display transcript as user's message, then insert assistant placeholder
                setMessages(prev=>{
                  assistantIndex = prev.length + 1; // assistant will be after the new user message
                  return [...prev, {role:'user', text: transcript}, {role:'assistant', text: ''}];
                });
              },
              partial: ({chunk})=>{
                setMessages(prev=>{
                  const copy = prev.slice();
                  const cur = copy[assistantIndex] || {role:'assistant', text:''};
                  cur.text = (cur.text || '') + chunk;
                  copy[assistantIndex] = cur;
                  return copy;
                });
              },
              audio: ({audio_base64})=>{
                console.log('AUDIO_EVENT: received audio event, size=', audio_base64?audio_base64.length:0);
                if(audio_base64){
                  try{
                    console.log('AUDIO_EVENT: decoding base64...');
                    const bytes = atob(audio_base64);
                    const len = bytes.length;
                    const buffer = new Uint8Array(len);
                    for(let i=0;i<len;i++) buffer[i]=bytes.charCodeAt(i);
                    const blob = new Blob([buffer], {type: 'audio/wav'});
                    const url = URL.createObjectURL(blob);
                    console.log('AUDIO_EVENT: created blob URL:', url);
                    audioQueueRef.current.push(url);
                    console.log('AUDIO_EVENT: enqueued, queue size=', audioQueueRef.current.length);
                    // start playing if nothing is playing
                    setTimeout(()=>playNextAudio(), 0);
                  }catch(e){ console.error('AUDIO_EVENT: decode/enqueue failed', e); }
                }else{
                  console.warn('AUDIO_EVENT: no audio_base64 in event');
                }
              },
              final: ({text: finalText, audio_base64})=>{
                setMessages(prev=>{
                  const copy = prev.slice();
                  copy[assistantIndex] = {role:'assistant', text: finalText};
                  return copy;
                });
                if(audio_base64){
                  try{
                    const bytes = atob(audio_base64);
                    const len = bytes.length;
                    const buffer = new Uint8Array(len);
                    for(let i=0;i<len;i++) buffer[i]=bytes.charCodeAt(i);
                    const blob2 = new Blob([buffer], {type: 'audio/wav'});
                    const url = URL.createObjectURL(blob2);
                    if(audioRef.current){ audioRef.current.src = url; audioRef.current.play().catch(()=>{}); }
                  }catch(e){ console.error('playback failed', e); }
                }
              },
              error: ({error})=>{
                setMessages(m => [...m, {role:'system', text: 'Error: '+(error||'unknown')}]);
              }
            });

          }catch(err){
            console.error('upload failed', err);
            setMessages(m => [...m, {role:'system', text: 'Téléversement/transcription échoué : ' + (err.message||err)}]);
          }
        }

        // Get the last assistant message for mobile kiosk display
        const lastAssistantMsg = messages.filter(m => m.role === 'assistant').slice(-1)[0];
        const kioskStatus = recording ? 'listening' : loading ? 'processing' : '';
        const kioskStatusText = recording 
          ? "J'écoute..." 
          : loading 
            ? "Réflexion en cours..." 
            : "";

        // Render mobile kiosk or desktop based on screen size
        if (isMobile) {
          // Filter messages for chat display (exclude welcome typing)
          const chatMessages = messages.filter((m, i) => i > 0 || m.text !== '');
          
          return (
            <React.Fragment>
              {/* ========== MOBILE KIOSK VIEW ========== */}
              {/* Layout: Left = Cat button, Right = Chat history */}
              <div className="mobile-kiosk" style={{display: 'flex'}}>
                
                {/* LEFT: Cat as clickable button */}
                <div className="kiosk-left">
                  <button 
                    className={"cat-button" + (recording ? " recording" : "")}
                    onClick={onSpeak}
                    disabled={loading && !recording}
                  >
                    <div className="cat-wrapper">
                      <div className="cat-halo"></div>
                      <img 
                        className="kiosk-cat" 
                        src="michkia_gentil_transp.png" 
                        alt="Michk.IA" 
                        onError={(e)=>{ e.target.src='michkia_transp.png'; }} 
                      />
                    </div>
                    <div className="cat-message">
                      {recording 
                        ? `Michk.IA vous écoute... ${countdown}s`
                        : loading
                          ? "Michk.IA réfléchit..."
                          : "Touche Michk.IA pour lui parler"
                      }
                    </div>
                  </button>
                </div>
                
                {/* RIGHT: Chat history */}
                <div className="kiosk-right">
                  <div className="kiosk-chat-history" ref={messagesRef}>
                    {chatMessages.length === 0 ? (
                      <div className="kiosk-empty">
                        La conversation apparaîtra ici...
                      </div>
                    ) : (
                      chatMessages.map((m, i) => (
                        <div 
                          key={i} 
                          className={"kiosk-msg " + m.role}
                          dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(marked.parse(m.text || ''))}}
                        />
                      ))
                    )}
                  </div>
                </div>
              </div>
              
              {/* Audio element */}
              <audio ref={audioRef} style={{display:'none'}} />
            </React.Fragment>
          );
        }

        return (
          <React.Fragment>
            {/* ========== MOBILE KIOSK VIEW (CSS fallback) ========== */}
            <div className="mobile-kiosk">
              <div className="kiosk-left">
                <button 
                  className={"cat-button" + (recording ? " recording" : "")}
                  onClick={onSpeak}
                  disabled={loading && !recording}
                >
                  <div className="cat-wrapper">
                    <div className="cat-halo"></div>
                    <img 
                      className="kiosk-cat" 
                      src="michkia_gentil_transp.png" 
                      alt="Michk.IA" 
                      onError={(e)=>{ e.target.src='michkia_transp.png'; }} 
                    />
                  </div>
                  <div className="cat-message">
                    {recording 
                      ? `Michk.IA vous écoute... ${countdown}s`
                      : loading
                        ? "Michk.IA réfléchit..."
                        : "Appuyez sur Michk.IA pour lui parler"
                    }
                  </div>
                </button>
              </div>
              
              <div className="kiosk-right">
                <div className="kiosk-chat-history">
                  {messages.filter((m, i) => i > 0 || m.text !== '').map((m, i) => (
                    <div 
                      key={i} 
                      className={"kiosk-msg " + m.role}
                      dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(marked.parse(m.text || ''))}}
                    />
                  ))}
                </div>
              </div>
            </div>
            
            {/* ========== DESKTOP VIEW ========== */}
            <div className="shell">
              {/* Header: Cat + Title */}
              <div className="header-bar">
                <div className="brand">
                  <div className="cat-avatar">
                    <img className="cat-image" src="michkia_gentil_transp.png" alt="Michk.IA" onError={(e)=>{ e.target.src='michkia_transp.png'; }} />
                  </div>
                  <div className="brand-text">
                    <div className="title">Michk.IA</div>
                    <div className="subtitle">L'IA dangereuse venue du futur</div>
                  </div>
                </div>
                <div className="meta">/!\ Interface expérimentale<br/>/!\ Comportement instable</div>
              </div>

              {/* Full-width Chat */}
              <div className="card chat-area">
                <div className="messages" id="messages" ref={messagesRef}>
                  {messages.map((m,i)=>{
                    const isUser = m.role === 'user';
                    const isAssistant = m.role === 'assistant';
                    const roleLabel = isUser ? 'Vous' : isAssistant ? 'Michk.IA' : 'Système';
                    return (
                      <div key={i} className="message">
                        {isAssistant ? (
                          <div className="avatar assistant">
                            <img src="michkia_transp.png" alt="Michk.IA" className="avatar-img" />
                          </div>
                        ) : (
                          <div className={"avatar " + (isUser ? 'user' : 'system')}>{isUser ? 'U' : 'S'}</div>
                        )}
                        <div className={"bubble " + (isUser ? 'user' : isAssistant ? 'assistant' : 'system')}> 
                          <div style={{fontSize:12, color: isAssistant ? '#39ff14' : '#374151', marginBottom:6, fontWeight:600}}>{roleLabel}</div>
                          <div dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(marked.parse(m.text || ''))}} />
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* floating jump-to-bottom button */}
                <button
                  title="Aller au bas"
                  onClick={()=>{
                    if(messagesRef.current){ messagesRef.current.scrollTo({ top: messagesRef.current.scrollHeight, behavior: 'smooth' }); isAtBottomRef.current = true; setShowScrollBtn(false); }
                  }}
                  style={{
                    position:'absolute',
                    right:16,
                    bottom:92,
                    display: showScrollBtn ? 'inline-flex' : 'none',
                    alignItems:'center',
                    justifyContent:'center',
                    padding:'8px 12px',
                    borderRadius:8,
                    boxShadow:'0 6px 16px rgba(2,6,23,0.08)',
                    background:'#0ea5e9',
                    color:'#fff',
                    border:'none',
                    cursor:'pointer'
                  }}
                >
                  Aller au bas
                </button>

                <form onSubmit={onSend} className="controls">
                  <div className="input-row">
                    <textarea 
                      value={input} 
                      onChange={e=>setInput(e.target.value)} 
                      onKeyDown={e=>{ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if(input.trim() && !loading){ sendText(input); setInput(''); } } }}
                      placeholder="Tapez votre question ou appuyez sur 'Parler'..." 
                    />
                    <div className="btn-group">
                      {loading ? (
                        <button className="btn stop" type="button" onClick={stopGeneration}>[STOP]</button>
                      ) : (
                        <React.Fragment>
                          <button className="btn" type="submit" disabled={loading}>&gt; Envoyer</button>
                          <button className={"btn speak" + (recording ? " recording" : "")} type="button" onClick={onSpeak}>
                            {recording ? `[REC ${countdown}s]` : 'Parler'}
                          </button>
                        </React.Fragment>
                      )}
                    </div>
                  </div>

                  <div className="row">
                    <div style={{display:'flex', gap:8}}>
                      <button type="button" className="btn ghost" onClick={()=>{setMessages([]); fetch('/api/clear-history',{method:'POST'}).catch(()=>{});}}>Effacer</button>
                      <button type="button" className="btn ghost" onClick={async ()=>{
                        try{ const r = await fetch('/api/history'); const h = await r.json(); setMessages(h.map(item=>({role:item.role, text:item.content}))); }catch(e){ console.error(e); }
                      }}>Historique</button>
                    </div>

                  </div>
                </form>
              </div>

            </div>
            
            {/* Audio element (shared between views) */}
            <audio ref={audioRef} style={{display:'none'}} />
          </React.Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
  </body>
</html>
